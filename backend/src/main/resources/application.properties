# Server Configuration
server.port=${PORT:8080}

# Application Info
spring.application.name=comparehub-backend

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/comparehub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Provider Configurations
app.providers.amazon.enabled=${PROVIDER_AMAZON_ENABLED:true}
app.providers.amazon.api-key=${AMAZON_API_KEY:}
app.providers.amazon.api-url=${AMAZON_API_URL:https://api.amazon.com/affiliate/v1}
app.providers.amazon.timeout-ms=${AMAZON_TIMEOUT_MS:3000}

app.providers.flipkart.enabled=${PROVIDER_FLIPKART_ENABLED:true}
app.providers.flipkart.api-key=${FLIPKART_API_KEY:}
app.providers.flipkart.api-url=${FLIPKART_API_URL:https://affiliate-api.flipkart.net/v1}
app.providers.flipkart.timeout-ms=${FLIPKART_TIMEOUT_MS:3000}

app.providers.croma.enabled=${PROVIDER_CROMA_ENABLED:true}
app.providers.croma.api-key=${CROMA_API_KEY:}
app.providers.croma.api-url=${CROMA_API_URL:https://api.croma.com/v1}
app.providers.croma.timeout-ms=${CROMA_TIMEOUT_MS:3000}

app.providers.open-products.enabled=${PROVIDER_OPEN_PRODUCTS_ENABLED:true}
app.providers.open-products.api-url=${OPEN_PRODUCTS_API_URL:https://dummyjson.com/products/search}
app.providers.open-products.timeout-ms=${OPEN_PRODUCTS_TIMEOUT_MS:3500}

# Cache Configuration (Redis & Fallback)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
app.cache.redis.enabled=${REDIS_ENABLED:true}
spring.cache.cache-names=product-comparisons,flight-searches,geocoding-locations,provider-metadata,provider-health

# Resilience4j Circuit Breaker Configurations
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3

# Resilience4j Retry Configurations
resilience4j.retry.configs.default.maxAttempts=2
resilience4j.retry.configs.default.waitDuration=500ms

# Best Value Ranking Configurable Weights
app.ranking.product.price-weight=0.40
app.ranking.product.rating-weight=0.20
app.ranking.product.discount-weight=0.15
app.ranking.product.delivery-weight=0.15
app.ranking.product.trust-weight=0.10

app.ranking.flight.price-weight=0.50
app.ranking.flight.duration-weight=0.30
app.ranking.flight.stops-weight=0.20

app.ranking.ride.fare-weight=0.60
app.ranking.ride.eta-weight=0.40
