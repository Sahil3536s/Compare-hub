# Development Profile Configuration
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/comparehub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 5000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    cache-names: product-comparisons,flight-searches,geocoding-locations,provider-metadata,provider-health

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cache:
    redis:
      enabled: ${REDIS_ENABLED:true}
  providers:
    amazon:
      enabled: ${PROVIDER_AMAZON_ENABLED:true}
      api-key: ${AMAZON_API_KEY:}
      api-url: ${AMAZON_API_URL:https://api.amazon.com/affiliate/v1}
      timeout-ms: ${AMAZON_TIMEOUT_MS:3000}
    flipkart:
      enabled: ${PROVIDER_FLIPKART_ENABLED:true}
      api-key: ${FLIPKART_API_KEY:}
      api-url: ${FLIPKART_API_URL:https://affiliate-api.flipkart.net/v1}
      timeout-ms: ${FLIPKART_TIMEOUT_MS:3000}
    croma:
      enabled: ${PROVIDER_CROMA_ENABLED:true}
      api-key: ${CROMA_API_KEY:}
      api-url: ${CROMA_API_URL:https://api.croma.com/v1}
      timeout-ms: ${CROMA_TIMEOUT_MS:3000}
    open-products:
      enabled: ${PROVIDER_OPEN_PRODUCTS_ENABLED:true}
      api-url: ${OPEN_PRODUCTS_API_URL:https://dummyjson.com/products/search}
      timeout-ms: ${OPEN_PRODUCTS_TIMEOUT_MS:3500}
