spring:
  application:
    name: comparehub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:8080}

# Comparison multi-factor ranking weights configuration
comparison:
  ranking:
    price-weight: 0.45
    rating-weight: 0.25
    delivery-weight: 0.15
    discount-weight: 0.10
    availability-weight: 0.05
    prior-rating: 3.5
    confidence-threshold: 50.0

# Common ranking weights configuration
app:
  ranking:
    product:
      price-weight: 0.45
      rating-weight: 0.25
      discount-weight: 0.10
      delivery-weight: 0.15
      trust-weight: 0.05
    flight:
      price-weight: 0.50
      duration-weight: 0.30
      stops-weight: 0.20
    ride:
      fare-weight: 0.60
      eta-weight: 0.40
  ml:
    service-url: ${ML_SERVICE_URL:http://localhost:8000}
    min-history-points: ${MIN_HISTORY_POINTS:20}

# Resilience4j Defaults
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 500ms
